<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#151819">
    <title>ELA — Execution &amp; Logic Agent</title>
  </head>
  <body>
    <main class="shell">
      <header class="intro">
        <span class="network">Diana Testnet</span>
        <h1>ELA</h1>
        <p class="subtitle">Execution &amp; Logic Agent</p>
        <p class="intro-copy">A web agent for querying QoreChain in Turkish.</p>
      </header>

      <section class="command-panel" aria-label="Command">
        <form id="command-form">
          <label for="command">Turkish command</label>
          <textarea id="command" name="command" lang="tr" rows="2" required
            placeholder="QoreChain son blok numarasını öğren."></textarea>
          <div class="form-actions">
            <div class="examples">
              <button type="button" id="example" class="example">Use example command</button>
              <button type="button" id="example-network" class="example">Check Diana network</button>
            </div>
            <button type="submit" id="run" class="run">Run query <span aria-hidden="true">→</span></button>
          </div>
        </form>
        <div class="context-bar">
          <p id="context-status" class="context-status" aria-live="polite">Context: none</p>
          <button type="button" id="clear-context" class="example" disabled>Clear context</button>
        </div>
      </section>

      <section class="result" aria-labelledby="result-heading">
        <div class="result-heading">
          <h2 id="result-heading">Query result</h2>
          <div class="status">
            <span>Status</span>
            <span id="query-state" class="state" data-state="ready">Ready</span>
          </div>
        </div>
        <dl class="result-data">
          <div class="height">
            <dt>Block Height</dt>
            <dd id="block-number">—</dd>
          </div>
          <div class="result-meta">
            <div>
              <dt>Network</dt>
              <dd id="chain-id">—</dd>
            </div>
            <div>
              <dt>EVM Chain ID</dt>
              <dd id="evm-chain-id">—</dd>
            </div>
            <div>
              <dt>Data Source</dt>
              <dd>EVM JSON-RPC</dd>
            </div>
          </div>
        </dl>
        <section id="plan" class="plan" aria-labelledby="plan-heading" hidden>
          <div class="plan-heading">
            <h3 id="plan-heading">Executed steps</h3>
            <span id="plan-target" class="plan-target"></span>
          </div>
          <ol id="plan-steps" class="plan-steps"></ol>
          <p id="plan-source" class="plan-source"></p>
        </section>
        <p id="query-message" class="message" role="status">Waiting for a command.</p>
      </section>

      <footer class="footer">Read-only <span aria-hidden="true">·</span> No signing</footer>
    </main>
    <script type="module" src="/src/web.ts"></script>
  </body>
</html>
