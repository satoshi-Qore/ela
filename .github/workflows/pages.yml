name: Deploy to GitHub Pages

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # ML-DSA in node:crypto (used by the PQC tests) needs Node.js 24.6.0 or newer.
          node-version: '>=24.6.0 <25'
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci
      - name: Show test browser
        run: google-chrome --version
      - name: Run automated tests
        # Same command as the Tests workflow. Browser tests must run, not skip; the live Diana test
        # stays skipped (ELA_LIVE is not set).
        env:
          ELA_REQUIRE_CHROME: '1'
        run: npm test
      - name: Build production site
        run: npm run build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
