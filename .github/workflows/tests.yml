name: Tests

on: [pull_request, push]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # ML-DSA in node:crypto (used by the PQC tests) needs Node.js 24.6.0 or newer.
          node-version: '>=24.6.0 <25'
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci
      - name: Show test browser
        run: google-chrome --version
      - name: Run automated tests
        # Browser tests must run, not skip. The live Diana test stays skipped (ELA_LIVE is not set).
        env:
          ELA_REQUIRE_CHROME: '1'
        run: npm test
      - name: Build production site
        run: npm run build
